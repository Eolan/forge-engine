# The island's world (#211, D-053): every setting that decides what the island is.
#
# - Edit a value and run `island` (or `city-blocks --island 7`): the products it reaches are
#   made again, the others load from the cache (#208).
# - A key left out takes the code's value. A key the description doesn't have is an error.
# - A setting that can be off is `false` when off: `steps = false` under [rivers] leaves the
#   rivers' steps out; `wind = false` keeps the rain flat.
# - The flags (`--island-plain 0.3`, `--no-steps`…) override this file for one run, and the
#   log names each. `island --print-world` prints the world a run uses, flags applied.
# - The meaning of each key is documented on its type in `forge-procgen`: [island] is
#   `IslandParams`, [erosion] `ErosionParams`, [rivers] `RibbonParams`, [channels]
#   `ChannelParams`, [valleys] `ValleyParams`. [ground] and [layers] are the island's own,
#   documented in `demos/city-blocks/src/world.rs`.
#
# `island.size` is the samples a side: 16 384 m / `island.spacing` + 1.

