# The Moon for the `planet` demo (#220, D-056): `planet --world assets/worlds/moon.toml`.
#
# - The map is NASA's CGI Moon Kit's elevation at 16 samples a degree (NASA's Scientific
#   Visualization Studio, from the Lunar Reconnaissance Orbiter's laser altimeter), fetched and
#   converted by tools/fetch-planets.sh: metres over the mean radius.
# - The keys are those of `earth.toml`.

[planet]
seed = 2
radius = 1737400.0

[map]
file = "assets/planets/moon/moon-ldem16.i16"
size = [5760, 2880]
detail = [3000.0, 11, 60.0, 0.55]
rough_above = 2000.0
sea = false
colour = "assets/planets/moon/moon-colour-4k.png"
colour_albedo = false
sea_mask = false

[tiles]
samples = 257
finest = 12
rings = 1.0

[view]
# Tycho, its rays and its central peaks.
target = [-43.3, -11.2]
heading = 0.0
orbit = 4000000.0
atmosphere = false
# Low from the south, long shadows on Tycho's floor; the Earth overhead three quarters lit.
sun = [190.0, 15.0]
# The stars, turned by the Moon's pole and prime meridian at J2000.0 (the IAU's α₀ 266.86°,
# δ₀ 65.64°, W 38.32°).
stars = "assets/planets/sky/stars-8k.png"
sky_pole = [266.86, 65.64]
sky_meridian = 38.32

# The Earth over Tycho, about 46° up and a little east of north (Tycho lies 44° from the point
# under the Earth), 1.9° across; Europe and Africa towards the Moon. Its air a rim of blue light.
[[view.bodies]]
name = "the Earth"
map = "assets/planets/earth/earth-colour-16k.jpg"
albedo = 1.0
radius = 6371000.0
distance = 384400000.0
azimuth = 13.0
elevation = 46.0
facing = [15.0, 15.0]
air = [0.1, 0.16, 0.32, 0.02]

[[view.tour]]
name = "the Moon from 4 000 km"
at = [-43.3, -11.2]
height = 4000000.0
heading = 0.0
pitch = -89.0
fov = 60.0
travel = 0.0
hold = 4.0

[[view.tour]]
name = "Tycho from 60 km"
at = [-44.6, -11.2]
height = 60000.0
heading = 0.0
pitch = -30.0
fov = 60.0
travel = 10.0
hold = 5.0

[[view.tour]]
name = "on Tycho's floor"
at = [-43.45, -11.2]
height = 40.0
heading = 0.0
pitch = 0.0
fov = 60.0
travel = 12.0
hold = 4.0

[[view.tour]]
name = "the Earth over Tycho"
at = [-43.45, -11.2]
height = 40.0
heading = 13.0
pitch = 46.0
fov = 12.0
travel = 4.0
hold = 6.0
