# The Earth for the `planet` demo (#220, D-056), its default world.
#
# - Edit a value and run `planet`: the tiles it reaches cook again; the others load from the
#   cache (`cache/meshes/earth@…`).
# - A key left out takes the code's value. A key the description doesn't have is an error.
# - The meaning of each key is documented on its type in `forge-terrain`'s `planet` module:
#   [planet] is `PlanetParams`, [map] `MapParams`, [tiles] `TileParams`, [view] `ViewParams`.
# - Lengths are metres, angles degrees.
# - The map is NOAA's ETOPO 2022 at 60 arc-seconds (public domain), fetched and converted by
#   tools/fetch-planets.sh. `map = false` makes the planet from noise alone ([planet]'s keys).

[planet]
seed = 1
radius = 6371000.0

[map]
file = "assets/planets/earth/etopo-60s.i16"
size = [21600, 10800]
detail = [4000.0, 11, 90.0, 0.55]
rough_above = 1200.0
sea = true
colour = "assets/planets/earth/earth-colour-16k.jpg"
colour_albedo = true
sea_mask = "assets/planets/earth/earth-sea-8k.png"

# The tour's region at 90 m: the Copernicus DEM GLO-90 from 41° to 47° N and 5° to 10° E, the Alps,
# the Côte d'Azur and Corsica (tools/fetch-planets.sh). Its bounds are its samples' cells', as
# assets/blender/planet_region.py prints them (the tiles' first samples sit on the whole degrees).
# It fades into ETOPO over a quarter of a degree. Its noise starts at 180 m, the narrowest the
# 90 m samples hold, and stays gentle: stronger, its slopes laid rock over meadows.
[[map.regions]]
file = "assets/planets/earth/glo90-alps.i16"
size = [6000, 7200]
bounds = [4.9995833, 9.9995833, 41.0004167, 47.0004167]
blend = 0.25
detail = [180.0, 6, 10.0, 0.55]

[tiles]
samples = 257
finest = 14
rings = 1.0
# The swap rule (#220): a tile splits where its samples would stand over 2.5 px apart on
# ground whose next level adds slopes of 1° or more, or where that level's height would show
# over a pixel.
spacing_px = 2.5
slope = 1.0
error_px = 1.0

[view]
# The Côte d'Azur by Èze, where the Alps fall into the sea: the descent comes in over the Alps
# and ends looking out over the Mediterranean.
target = [43.728, 7.362]
heading = 180.0
orbit = 400000.0
atmosphere = true
sun = [240.0, 25.0]
# The stars: NASA's Deep Star Maps 2020 (tools/fetch-planets.sh), turned by the Earth's pole and
# its rotation at J2000.0 (W = 280.46°).
stars = "assets/planets/sky/stars-8k.png"
sky_pole = [0.0, 90.0]
sky_meridian = 280.46

# The Moon over the sea towards Italy, 120° from the sun: three quarters lit. Its near side faces
# the Earth; its colour map, brightened for show, times 0.2 is its albedo of about 0.12.
[[view.bodies]]
name = "the Moon"
map = "assets/planets/moon/moon-colour-4k.png"
albedo = 0.2
radius = 1737400.0
distance = 384400000.0
azimuth = 100.0
elevation = 20.0
facing = [0.0, 0.0]
air = false

# The tour (`planet --tour`): heights in metres over the ground there, angles in degrees, times in
# seconds.
[[view.tour]]
name = "the Alps from the station"
at = [47.5, 7.5]
height = 400000.0
heading = 180.0
pitch = -35.0
fov = 60.0
travel = 0.0
hold = 4.0

[[view.tour]]
name = "Corsica straight down"
at = [42.15, 9.1]
height = 400000.0
heading = 0.0
pitch = -89.0
fov = 60.0
travel = 10.0
hold = 5.0

[[view.tour]]
name = "Mont Blanc"
at = [45.55, 6.55]
height = 6000.0
heading = 40.0
pitch = -10.0
fov = 60.0
travel = 12.0
hold = 5.0

[[view.tour]]
name = "Èze over the sea"
at = [43.74, 7.36]
height = 120.0
heading = 180.0
pitch = -4.0
fov = 60.0
travel = 14.0
hold = 5.0

[[view.tour]]
name = "the Moon over the sea"
at = [43.74, 7.36]
height = 120.0
heading = 100.0
pitch = 20.0
fov = 6.0
travel = 5.0
hold = 6.0
