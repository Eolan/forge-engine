# The Earth for the `planet` demo (#220, D-056), its default world.
#
# - Edit a value and run `planet`: the tiles it reaches cook again; the others load from the
#   cache (`cache/meshes/earth@…`).
# - A key left out takes the code's value. A key the description doesn't have is an error.
# - The meaning of each key is documented on its type in `forge-terrain`'s `planet` module:
#   [planet] is `PlanetParams`, [map] `MapParams`, [tiles] `TileParams`, [view] `ViewParams`.
# - Lengths are metres, angles degrees.
# - The map is NOAA's ETOPO 2022 at 60 arc-seconds (public domain), fetched and converted by
#   tools/fetch-planets.sh. `map = false` makes the planet from noise alone ([planet]'s keys).

[planet]
seed = 1
radius = 6371000.0

[map]
file = "assets/planets/earth/etopo-60s.i16"
size = [21600, 10800]
detail = [4000.0, 11, 90.0, 0.55]
rough_above = 1200.0
sea = true
colour = "assets/planets/earth/earth-colour-16k.jpg"
colour_albedo = true
sea_mask = "assets/planets/earth/earth-sea-8k.png"

[tiles]
samples = 257
finest = 14
rings = 1.0

[view]
# The Côte d'Azur by Èze, where the Alps fall into the sea: the descent comes in over the Alps
# and ends looking out over the Mediterranean.
target = [43.728, 7.362]
heading = 180.0
orbit = 400000.0
atmosphere = true
# The stars: NASA's Deep Star Maps 2020 (tools/fetch-planets.sh), turned by the Earth's pole and
# its rotation at J2000.0 (W = 280.46°).
stars = "assets/planets/sky/stars-8k.png"
sky_pole = [0.0, 90.0]
sky_meridian = 280.46
