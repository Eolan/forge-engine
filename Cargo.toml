[workspace]
resolver = "3"
members = ["crates/*", "demos/*", "tools/*"]
# Vendored crates, patched below: built as dependencies, not linted or formatted as ours.
exclude = ["third_party/gpu-allocator"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
ab_glyph = "0.2"
# Internal crates
forge-core = { path = "crates/forge-core" }
forge-task = { path = "crates/forge-task" }
forge-gpu = { path = "crates/forge-gpu" }
forge-geom = { path = "crates/forge-geom" }
forge-app = { path = "crates/forge-app" }
forge-procgen = { path = "crates/forge-procgen" }
forge-terrain = { path = "crates/forge-terrain" }
forge-render = { path = "crates/forge-render" }
forge-world = { path = "crates/forge-world" }
forge-physics = { path = "crates/forge-physics" }
forge-sim = { path = "crates/forge-sim" }
forge-net = { path = "crates/forge-net" }
forge-anim = { path = "crates/forge-anim" }
forge-fauna = { path = "crates/forge-fauna" }
forge-flora = { path = "crates/forge-flora" }
forge-nav = { path = "crates/forge-nav" }
forge-mission = { path = "crates/forge-mission" }
forge-script = { path = "crates/forge-script" }
forge-audio = { path = "crates/forge-audio" }
# The demos the island demo builds on
city-blocks = { path = "demos/city-blocks" }

# Graphics & windowing
ash = "0.38"
ash-window = "0.13"
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"] }
winit = "0.30"
raw-window-handle = "0.6"
meshopt = "0.7"
# glTF models (forge-geom, #138): the binary form with its buffer inside; no images, no URIs.
# `extras` for the morph targets' names (#169), read with serde_json.
gltf = { version = "1.4", default-features = false, features = ["utils", "names", "extras", "KHR_materials_emissive_strength", "KHR_texture_transform"] }

# Concurrency
crossbeam-deque = "0.8"
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
parking_lot = "0.13"
core_affinity = "0.8"
num_cpus = "1.16"

# Math & determinism
glam = "0.34"
libm = "0.2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }

# Data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", features = ["preserve_order"] }
# Content records (D-035: RON + serde), first for the missions (D-072, #287).
ron = "0.12"
# Scripts in Luau (D-072, #292): mlua over Luau, built from its sources (luau0-src).
mlua = { version = "0.12", features = ["luau"] }
bytemuck = { version = "1", features = ["derive"] }

# Diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# tracy-client 0.19 pairs with the Tracy 0.14 profiler GUI.
tracy-client = { version = "0.19", default-features = false, features = ["enable", "only-localhost"] }

# Tooling
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

# Only used by benchmarks as a comparison baseline; never by engine crates.
rayon = "1.12"

[workspace.lints.rust]
# `unsafe` is allowed only where a crate opts in explicitly (`forge-task` for scoped lifetimes,
# the GPU crates for Vulkan, `forge-physics` for Jolt). Every other crate forbids it at the crate
# root.
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "allow"

# Dependencies are compiled optimised even in debug builds: the engine's own crates stay fast to
# rebuild, while `ash`, `glam` and the allocators run at release speed during development.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
# Line tables for Tracy, RenderDoc and crash dumps; costs nothing at run time.
debug = "line-tables-only"
lto = "thin"
codegen-units = 4

[profile.bench]
inherits = "release"

# ash's master branch, pinned (the owner, 2026-10-28, #361): its last release, 0.38 of April 2024,
# stops at the Vulkan 1.3.281 headers; master carries 1.4.352 (cluster and partitioned
# acceleration structures, device-generated commands, present_wait2, Vulkan 1.4's commands).
# Patched for the whole graph, so gpu-allocator builds on the same ash. Move the pin with the
# weekly dependency check (tools/deps-check.sh shows how far master has gone); back to crates.io
# with the next release.
[patch.crates-io]
ash = { git = "https://github.com/ash-rs/ash", rev = "8844f6b4eefb16d08cd73c8f3d340e1ac12deb16" }
ash-window = { git = "https://github.com/ash-rs/ash", rev = "8844f6b4eefb16d08cd73c8f3d340e1ac12deb16" }
# gpu-allocator 0.28.0, vendored with ash master's renamed `push` (two calls in
# `src/vulkan/mod.rs`, marked "Forge (#361)"): back to crates.io once a release builds on ash's.
gpu-allocator = { path = "third_party/gpu-allocator" }
