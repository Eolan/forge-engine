[package]
name = "forge-render"
description = "Forge renderer: GPU-driven meshlet rendering with two-pass occlusion, background passes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytemuck = { workspace = true }
forge-core = { workspace = true }
forge-flora = { workspace = true }
forge-geom = { workspace = true }
forge-gpu = { workspace = true }
forge-world = { workspace = true }
glam = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr"] }
# BC7 encoding of the normal maps' rebuilt levels (D-086): Intel's ISPC Texture Compressor.
intel_tex_2 = "0.5"
tracing = { workspace = true }
