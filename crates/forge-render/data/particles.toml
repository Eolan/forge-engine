radius = [0.35, 1.6]
speed = [0.3, 0.8]
cone = 25.0
spread = 0.3
gravity = -0.03
drag = 1.2
wind = 1.0
curl = [0.35, 1.0]
colour = [[0.86, 0.86, 0.88, 0.086], [0.90, 0.90, 0.92, 0.0]]
sun = 0.2
draw = "smoke"

# Small steam: a sewer lid's holes, a grate's slots, a column half a metre to a metre wide (the
# private district's `*_0p5x2m`, `*_sewer_spouting_*`, `*_sewer_grate`): thin wisps, lit as the
# columns are. Drawn as the column, they laid wide bands over the streets.
[steam-column-small]
