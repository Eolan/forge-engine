# A flesh hit's spray (asked by an out-of-tree town for its rifle): dark red droplets in a burst
# along the shot, falling, each kept where it meets the ground or a wall (no bounce) until it
# fades: the spatter's first form, before decals (#304).
[blood-spray]
rate = 36.0
life = [0.6, 1.2]
radius = [0.03, 0.045]
speed = [1.5, 3.5]
cone = 35.0
spread = 0.03
gravity = 1.0
drag = 0.3
wind = 0.0
curl = [0.0, 1.0]
colour = [[0.1, 0.004, 0.003, 1.0], [0.06, 0.002, 0.002, 0.0]]
draw = "smoke"
burst = true
bounce = 0.0

# Steam rising from a street: a sewer grate's or a manhole's, a tall vent's plume (the private
# district's steam columns). A narrow column (puffs up to 1.8 m in radius, six a second, rising
# faster), 10 % opaque at birth and fading, taking a fifth of the sun's light: with all of it and
# puffs swelling to 3.2 m, a low sun turned a manhole's column into a bright ball that stood out
# of its shaded street, where the source's plume reads grey in the shade and only a little
# brighter in the sun (the owner, 2026-11-05). The wind takes them. Procedural puffs, not the
# baked flipbook: its sun-lit rims, stacked up a column, drew a coil.
[steam-column]
rate = 6.0
life = [4.0, 6.5]
radius = [0.9, 1.8]
speed = [1.0, 1.8]
cone = 12.0
spread = 1.2
gravity = -0.04
drag = 0.6
wind = 0.6
curl = [0.6, 2.5]
colour = [[0.86, 0.86, 0.88, 0.10], [0.90, 0.90, 0.92, 0.0]]
sun = 0.2
draw = "smoke"

