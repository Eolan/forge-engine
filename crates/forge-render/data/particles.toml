# The particle effects (D-064, #271), read by `forge_render::particles::effects`. One table an
# effect, named by its key. Units: metres, seconds, m/s; colours are linear albedo (rgb) and
# opacity (a), at birth and at death, mixed by age. Every particle's numbers come from its
# emitter's seed and its index in the emitter's stream, so an effect is the same at any frame rate.
#
#   rate     particles a second (a burst's count when `burst` is set)
#   life     a particle's life, the shortest and the longest
#   radius   its drawn radius at birth and at death
#   speed    its launch speed, the slowest and the fastest
#   cone     degrees from the emitter's direction it is launched within
#   spread   metres from the emitter's point it is born within (a disc across the direction)
#   gravity  times g, downwards; negative rises (warm smoke)
#   drag     1/s: how fast it takes the air's velocity
#   wind     the share of the scene's wind the air it rides has
#   curl     m/s and metres: turbulence, a divergence-free swirl of that speed and size
#   colour   rgba at birth and at death
#   draw     "smoke" (lit, alpha-blended puffs) or "glow" (unlit, added: embers, sparks)
#   burst    a burst of `rate` particles when the emitter is triggered, not a stream
#   texture  "smoke": drawn from the puff our own solver bakes (six-way lit); "fire": its heat as a
#            flame's glow (a glow's colour then scales it); else a procedural puff
#   bounce   it meets the scene (a ray a step against the static structure): the share of its
#            speed into a surface it keeps, bounced back (0 to 1); unset, it passes through
#   streak   drawn as a streak along its flight, as a shutter of 1/50 s sees it (sparks)
#   sun      the share of the sun's light a lit puff scatters (1 when unset; the sky's stays whole)

[chimney-smoke]
rate = 14.0
life = [5.0, 7.5]
radius = [0.7, 2.0]
speed = [0.5, 0.9]
cone = 12.0
spread = 0.12
gravity = -0.03
drag = 0.8
wind = 1.0
curl = [0.25, 1.5]
colour = [[0.32, 0.31, 0.30, 0.55], [0.55, 0.55, 0.56, 0.0]]
draw = "smoke"
texture = "smoke"

[footstep-dust]
