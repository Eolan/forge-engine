colour = [[0.86, 0.86, 0.88, 0.10], [0.90, 0.90, 0.92, 0.0]]
sun = 0.2
draw = "smoke"

# A tall plume: a rooftop's or a chimney's, 10 to 65 m tall in the private district's source
# (`*_3x3x20m`, `*_5x5x65`): wide puffs that rise about 2 m/s (the lift against the drag) for 6 to
# 10 s, lit as the columns are.
[steam-plume]
rate = 4.0
life = [6.0, 10.0]
radius = [1.5, 4.0]
speed = [2.0, 3.0]
cone = 8.0
spread = 1.5
gravity = -0.06
drag = 0.3
wind = 0.4
curl = [1.0, 4.0]
colour = [[0.86, 0.86, 0.88, 0.07], [0.90, 0.90, 0.92, 0.0]]
sun = 0.2
draw = "smoke"

