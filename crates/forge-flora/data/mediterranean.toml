# The Mediterranean village's species (#266, #269): its local forest's trees and the garrigue's
# shrubs. Heights and crown widths are the published ranges for grown plants, with their sources
# in docs/research/flora.md; the growth parameters (internode, angles, apical control, the
# crown's shape) are estimates fitted to the published descriptions, marked so there.
#
# The fields are documented on `forge_flora::Species`. Lengths in metres, angles in degrees,
# ages in years.

[[species]]
id = "aleppo-pine"
name = "Aleppo pine"
latin = "Pinus halepensis"
habit = "tree"
# 15–25 m (Wikipedia, the Conifer Society); crowns 7.6–15 m (Sacramento Tree Foundation's
# 25–60 ft at its low end, Van den Berk's 10–15 m at its high end).
height = [15.0, 25.0]
crown_width = [7.6, 15.0]
# 1.5–3 m after 10 years (the Conifer Society): 95 % of the height at about 80.
maturity = 80.0
foliage = "needles"
# Conical when young, a rounded to flat-topped crown on a long clear bole when old.
young_crown = { widest = 0.15, fullness = 0.9, base = 0.05 }
crown = { widest = 0.68, fullness = 0.32, base = 0.55 }
density = 0.7
internode = 0.3
# "Slender, irregular horizontal, upturned branches" (the Conifer Society).
branch_angle = 62.0
apical_control = 0.6
tropism = 0.22
wander = 0.22
pipe_exponent = 2.1
tip_radius = 0.013
leaf_cluster = 0.35
foliage_tips = 2
shed_after = 3
max_shoot = 4
limb_nodes = 150

# An open, irregular crown: few lobes, deep gaps.
lobes = [5, 8]
lobe_size = 0.45
lobe_depth = 0.4

[species.habitat]
# A pioneer of the dry, shallow, warm limestone, light-loving (docs/research/flora.md §3).
layer = "canopy"
soil = [0.0, 0.45]
moisture = [0.0, 0.45]
heat = [0.45, 1.0]
slope = [0.0, 35.0]
light = 0.55
spacing = 1.25
abundance = 0.7
opacity = 0.55

[species.look]
spray = "needles"
bark = [[0.26, 0.17, 0.12], [0.40, 0.31, 0.24]]
leaves = [[0.10, 0.18, 0.07], [0.17, 0.25, 0.09]]
underside = 0.2
through = 0.25

