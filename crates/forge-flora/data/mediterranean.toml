[[species]]
id = "italian-cypress"
name = "Italian cypress"
latin = "Cupressus sempervirens 'Stricta'"
habit = "tree"
# Over 12 m (RHS, Stricta Group), 20–30 m (Van den Berk's text), to 35 m for the species
# (Wikipedia); spread 1.5–2 m (Van den Berk) to 2.5–4 m (RHS).
