[package]
name = "forge-net"
description = "Forge networking: QUIC transport over quinn, a versioned protocol with connection tokens, channels, fragmentation and a seeded link conditioner (D-010)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
forge-core = { workspace = true }
glam = { workspace = true }
libm = { workspace = true }
thiserror = { workspace = true }
bytes = "1"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"
tokio = { version = "1", features = ["rt", "time", "sync", "net", "macros"] }
