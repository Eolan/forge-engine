[package]
name = "forge-gpu"
description = "Forge Vulkan layer: instance, device, memory, swapchain, Slang shaders, pipelines, frames in flight."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# DLSS Super Resolution through NVIDIA Streamline (Windows; the SDK stays outside the
# repository, in `streamline-sdk/`). Without it `Device::dlss` is always `None`.
dlss = ["dep:libloading"]
# NVIDIA NRD's SIGMA shadow denoiser (issue #172, D-049), loaded at run time from `nrd-sdk/bin`
# (git-ignored; `tools/fetch-nrd.sh` builds it). Without it the shadows keep their own ray.
nrd = ["dep:libloading"]

[dependencies]
ash = { workspace = true }
forge-core = { workspace = true }
ash-window = { workspace = true }
bytemuck = { workspace = true }
gpu-allocator = { workspace = true }
libloading = { version = "0.8", optional = true }
parking_lot = { workspace = true }
raw-window-handle = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
xxhash-rust = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The display configuration API (issue #94): the HDR switch and the SDR white level.
windows-sys = { version = "0.61", features = ["Win32_Devices_Display", "Win32_Foundation", "Win32_Graphics_Gdi"] }
