[package]
name = "forge-audio"
description = "Forge sound: a real-time mixer fed by a lock-free command queue, buses and a master limiter, voices with a budget, streaming decode, spatialisation, rendered headless (D-011, issue #267)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
forge-core = { workspace = true }
glam = { workspace = true }
# The wait-free single-producer, single-consumer ring buffers between the game, decode and
# audio threads.
rtrb = "0.4"
# Ogg Vorbis, pure Rust.
lewton = { version = "0.10", default-features = false, features = ["ogg"] }
# Ogg pages for Opus (the version lewton reads with).
ogg = "0.8"
# Opus, pure Rust: a port of libopus 1.6.
opus-rs = "0.1"
thiserror = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
clap = { workspace = true }

[features]
# The audio device (`device`, #318) for forge-app and the `audio-demo` example: `cpal` (WASAPI),
# on Windows only for now (ALSA needs system headers the Linux CI does not install). Nothing
# else in the crate opens a device.
device = ["dep:cpal"]
# Steam Audio's binaural rendering (HRTF) as a `Spatializer` (D-011): `audionimbus` over the
# Steam Audio SDK, which is not in the repository (`docs/demos/audio.md` says where to put it).
# Windows only for now, like the device. Its bindings are generated by bindgen, which needs
# libclang (LLVM) where it builds.
steam-audio = ["dep:audionimbus"]

[target.'cfg(windows)'.dependencies]
cpal = { version = "0.18", optional = true }
audionimbus = { version = "0.16", optional = true, default-features = false }

[[example]]
name = "audio-demo"
required-features = ["device"]
