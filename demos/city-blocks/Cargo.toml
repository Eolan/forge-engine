[package]
name = "city-blocks"
description = "The Phase 1 closing demo, built in steps: the prop gallery of twenty cooked, cached props (issue #34)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# DLAA through NVIDIA Streamline (Windows, the SDK in `streamline-sdk/`, an RTX GPU), on by
# default (D-045): DLAA where it runs, TAA elsewhere.
default = ["dlss", "nrd"]
dlss = ["forge-app/dlss"]
# NVIDIA NRD's SIGMA denoises the sun's soft shadows (D-049, #172), on by default: where its
# library is in `nrd-sdk/bin` (`tools/fetch-nrd.sh`); elsewhere the shadows keep their own ray.
nrd = ["forge-app/nrd"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
forge-app = { workspace = true }
forge-core = { workspace = true }
forge-anim = { workspace = true }
forge-geom = { workspace = true }
forge-physics = { workspace = true }
forge-sim = { workspace = true }
forge-gpu = { workspace = true }
forge-procgen = { workspace = true }
forge-terrain = { workspace = true }
forge-render = { workspace = true }
forge-task = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
glam = { workspace = true }
tracing = { workspace = true }
winit = { workspace = true }
