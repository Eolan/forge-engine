name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The demos are built and tested on the owner's machine (tools/verify.sh), not here: CI
  # builds and tests the engine crates and the tools, and Clippy still checks the demos compile.
  NO_DEMOS: --exclude asteroids --exclude city-blocks --exclude city-plan --exclude island --exclude meshlets --exclude physics-lab --exclude planet --exclude task-bench

jobs:
  check:
    name: build, test, lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --release --workspace ${{ env.NO_DEMOS }}
      - name: Credits (docs/credits-crates.md up to date)
        run: cargo run --release -p credits -- --check
      - name: Test
        run: cargo test --release --workspace ${{ env.NO_DEMOS }}
      - name: Clippy
        run: cargo clippy --release --all-features --all-targets -- -D warnings
      # The Luau game scripts against the game API's definitions (D-072, #319): luau-lsp's
      # release, pinned with its checksum, on Linux.
      - name: Luau scripts (luau-lsp analyze)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -sSfL -o "$RUNNER_TEMP/luau-lsp.zip" \
            https://github.com/JohnnyMorganz/luau-lsp/releases/download/1.70.1/luau-lsp-linux-x86_64.zip
          echo "1a2ea1ae4f98f8946cefd970a4b54853e11ab4775e6932faa7f60cf920346567  $RUNNER_TEMP/luau-lsp.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/luau-lsp.zip" -d "$RUNNER_TEMP/luau-lsp"
          chmod +x "$RUNNER_TEMP/luau-lsp/luau-lsp"
          LUAU_LSP="$RUNNER_TEMP/luau-lsp/luau-lsp" bash tools/luau-check.sh
