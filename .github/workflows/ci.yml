name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The demos are built and tested on the owner's machine (tools/verify.sh), not here: CI
  # builds and tests the engine crates and the tools, and Clippy still checks the demos compile.
  NO_DEMOS: --exclude asteroids --exclude city-blocks --exclude city-plan --exclude island --exclude meshlets --exclude physics-lab --exclude planet --exclude task-bench

jobs:
  check:
    name: build, test, lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --release --workspace ${{ env.NO_DEMOS }}
      - name: Credits (docs/credits-crates.md up to date)
        run: cargo run --release -p credits -- --check
      - name: Test
        run: cargo test --release --workspace ${{ env.NO_DEMOS }}
      - name: Clippy
        run: cargo clippy --release --all-features --all-targets -- -D warnings
