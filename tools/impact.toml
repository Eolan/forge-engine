# Which captures a changed path selects (issue #134; docs/PROCESS.md, "Tiers").
#
# tools/verify.sh reads it. A changed path takes the sets of the first pattern of [paths] that
# matches it, in this file's order. A path no pattern matches sends the change to Tier 1, the
# full batch: an unknown path is a shared one until it is mapped here.
#
# Patterns: `**/` any directories (none too), `**` anything, `*` anything but `/`. Sets: the
# names tools/captures.sh knows (sentinels, meshlets, ballad, city, island, lab, planet); [] means no
# capture, the gate only. Tier 0 always adds the sentinels when a set is selected.
#
# One entry per line, `"pattern" = [...]` or `"pattern" = true`: verify.sh reads this subset
# of TOML line by line.

[paths]
# The gate only: words and numbers, no pixels.
"docs/**" = []
"reports/**" = []
"**/*.md" = []
"tools/credits/**" = []
"tools/sharpness/**" = []
# Claude's settings and its agents' worktrees: never built, never committed (#220).
".claude/**" = []

# The island: its generator, its demo, its stones and its water. The city-blocks code that
# serves both the city and its island selects both.
# The sea's spectrum also floats the physics lab's sea (#138).
"crates/forge-procgen/src/ocean.rs" = ["island", "lab"]
"crates/forge-procgen/**" = ["island"]
# The island's makers (#212, D-053) and its world file (#211).
# The planet (#220, D-056): its makers, its worlds, its demo; the fetch script draws nothing.
"crates/forge-terrain/src/planet.rs" = ["planet"]
"assets/worlds/earth.toml" = ["planet"]
"assets/worlds/moon.toml" = ["planet"]
"demos/planet/**" = ["planet"]
"tools/fetch-planets.sh" = []
"tools/swap-check.sh" = []
"crates/forge-terrain/**" = ["island"]
"assets/worlds/**" = ["island"]
"demos/island/**" = ["island"]
"demos/city-blocks/src/island_demo.rs" = ["island"]
# The physics lab (#136): its demo and scenes, the physics under them, Jolt's sources.
"demos/physics-lab/**" = ["lab"]
# The walking player and the materials' rows (#216): the lab's and the island's walker's.
"demos/city-blocks/src/character.rs" = ["island", "lab"]
"demos/city-blocks/src/traction.rs" = ["island", "lab"]
"crates/forge-geom/src/model.rs" = ["lab"]
"crates/forge-geom/src/fracture.rs" = ["lab"]
"assets/models/**" = ["lab"]
# The labs' external models (#170, D-048): their manifest; the fetch script draws nothing.
"assets/external.tsv" = ["lab"]
"tools/fetch-assets.sh" = []
# The tiers themselves (#199): what they run, not what the demos draw.
"tools/verify.sh" = []
"tools/impact.toml" = []
# The occasional AMD check (#28): a script the tiers do not run.
"tools/amd-check.sh" = []
"assets/blender/**" = []
"crates/forge-physics/**" = ["lab"]
"crates/forge-sim/**" = ["lab"]
# The clip runtime (#165): the lab's skinned creatures.
"crates/forge-anim/**" = ["lab"]
"third_party/jolt/**" = ["lab"]
"demos/city-blocks/**" = ["island", "city", "lab"]
"crates/forge-geom/src/stone.rs" = ["island"]
"crates/forge-render/src/water.rs" = ["island", "lab"]
# The cloud layer (#145): the island draws it with `--clouds`.
"crates/forge-render/src/clouds.rs" = ["island"]
"shaders/clouds.slang" = ["island"]
"crates/forge-render/src/wakes.rs" = ["island"]
"crates/forge-render/src/splashes.rs" = ["island", "lab"]
"shaders/water.slang" = ["island", "lab"]
# Imported by meshlet.slang, but its code runs only on the island's wet ground (#105); the
# sentinels draw the other demos through meshlet.slang.
"shaders/shore.slang" = ["island"]
"shaders/wakes.slang" = ["island"]
"shaders/splashes.slang" = ["island", "lab"]
"shaders/splash_foam.slang" = ["island", "lab"]
# The lab's liquid (#156).
# The skinned creatures (#165): only the lab draws skinned meshes.
"crates/forge-render/src/skin.rs" = ["lab"]
"shaders/skin.slang" = ["lab"]
"crates/forge-render/src/liquid.rs" = ["lab"]
"shaders/liquid.slang" = ["lab"]
"shaders/liquid_draw.slang" = ["lab"]

# The ballad and the shaders only it draws.
"demos/asteroids/**" = ["ballad"]
"shaders/starfield.slang" = ["ballad"]
"shaders/dust.slang" = ["ballad"]

# The meshlets bench and the checks only it runs (`--mip-check`, `--tone-check`).
"demos/meshlets/**" = ["meshlets"]
"crates/forge-render/src/mipcheck.rs" = ["meshlets"]
"crates/forge-render/src/tonecheck.rs" = ["meshlets"]
"shaders/mipcheck.slang" = ["meshlets"]
"shaders/tonecheck.slang" = ["meshlets"]

# The loading screen (#200): no capture shows it; every demo opens through it, so the
# sentinels run it once.
"crates/forge-app/src/loading.rs" = ["sentinels"]
"shaders/loading.slang" = ["sentinels"]

# Everything else is shared: forge-gpu, forge-app, forge-render's other passes, forge-geom's
# other modules, forge-core, forge-task, forge-world, the other shaders, Cargo.toml and
# Cargo.lock, rust-toolchain.toml, .github/ and the other tools. Tier 1.

[recook]
# The props, the island's tiles and its heightfield are cached by their parameters' text, not
# the code that makes them: after a change here the captures make them again (FORGE_RECOOK).
"crates/forge-procgen/**" = true
"crates/forge-geom/**" = true

[gpu]
# GPU code and shaders: Tier 0 also runs its sets on the fallback path and under validation.
"shaders/**" = true
"crates/forge-render/**" = true
